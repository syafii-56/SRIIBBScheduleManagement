else if(R=='keperluan')b='<table><tr><th>Kelas</th><th>Subjek</th><th>Perlu</th><th>Dijadualkan</th><th>Belum</th></tr>'+S.req.map(r=>{const n=S.entries.filter(e=>e.cls==r.cls&&e.sub==r.sub).length;return'<tr><td>'+esc(N('classes',r.cls))+'</td><td>'+esc(N('subjects',r.sub))+'</td><td>'+r.hrs+'</td><td>'+n+'</td><td>'+Math.max(0,r.hrs-n)+'</td></tr>'}).join('')+'</table>';
else b=validate().map(x=>'<div class="it'+(x.sev=='c'?'':' w')+'">'+esc(x.msg)+'</div>').join('')||'<p>Tiada konflik atau amaran.</p>';
return'<div class="hd np"><h2>Laporan</h2></div><div class="row np">'+sel('rt',o,R,'onchange="R=this.value;render()"')+'<button onclick="window.print()">Cetak</button><button class=b2 onclick="txt(\'CSV Jadual\',csvE())">Eksport CSV</button><button class=b2 onclick="txt(\'Sandaran JSON\',JSON.stringify(S))">Sandaran JSON</button><button class=b2 onclick="txt(\'Import Sandaran\',\'\',1)">Import Sandaran</button></div><p class="mu np">Untuk PDF, pilih Cetak kemudian “Simpan sebagai PDF” (A4 landskap).</p><div class=ph><h2>SRIIBB — Jadual Waktu</h2></div>'+b}
function setp(){if(!D)D=JSON.parse(JSON.stringify(S.cfg));return'<div class=hd><h2>Tetapan Waktu Persekolahan</h2></div><div class=pn><div class=row><label>Waktu mula <input type=time id=cs value="'+D.start+'"></label><label>Waktu tamat <input type=time id=ce value="'+D.end+'"></label><label>Hari persekolahan '+sel('cd',[[5,'Isnin – Jumaat'],[6,'Isnin – Sabtu']],D.days)+'</label></div></div>'
+'<h3>Slot waktu</h3><div class=sc><table><tr><th>Mula</th><th>Tamat</th><th>Jenis</th><th>Label (rehat, perhimpunan…)</th><th></th></tr>'+D.slots.map((s,i)=>'<tr><td><input type=time class=sf data-i='+i+' data-f=s value="'+s.s+'"></td><td><input type=time class=sf data-i='+i+' data-f=e value="'+s.e+'"></td><td><select class=sf data-i='+i+' data-f=t><option value=t'+(s.t=='t'?' selected':'')+'>Pengajaran</option><option value=b'+(s.t=='b'?' selected':'')+'>Disekat</option></select></td><td><input class=sf data-i='+i+' data-f=l value="'+esc(s.l)+'"></td><td><button class=b2 onclick=dSlot('+i+')>Buang</button></td></tr>').join('')+'</table></div>'
+'<div class=row><button class=b2 onclick=aSlot()>+ Tambah slot</button><button onclick=saveCfg()>Simpan tetapan</button><button class=rd onclick="ask(\'Padam semua data dan kembali kepada data contoh?\',()=>{S=seed();hist=[];G=null;D=null;mut(\'Data ditetapkan semula\')})">Tetap semula data contoh</button></div><p class=mu>Data disimpan setempat dalam pelayar ini sahaja dan tidak disegerakkan antara peranti.</p>'}
function colD(){if(!D||!$('#cs'))return;D.start=$('#cs').value;D.end=$('#ce').value;D.days=+$('#cd').value;document.querySelectorAll('.sf').forEach(i=>D.slots[+i.dataset.i][i.dataset.f]=i.value)}
const aSlot=()=>{colD();const l=D.slots[D.slots.length-1];D.slots.push({id:uid('x'),s:l?l.e:'08:00',e:l?l.e:'08:30',t:'t',l:''});render()},dSlot=i=>{colD();D.slots.splice(i,1);render()};
function saveCfg(){colD();const sl2=D.slots.slice().sort((a,b)=>tm(a.s)-tm(b.s)),er=m=>toast(m);if(tm(D.start)>=tm(D.end))return er('Waktu mula mesti sebelum waktu tamat.');
for(let i=0;i<sl2.length;i++){const s=sl2[i];if(!s.s||!s.e||tm(s.s)>=tm(s.e))return er('Slot '+(i+1)+': masa tamat mesti selepas masa mula.');if(tm(s.s)<tm(D.start)||tm(s.e)>tm(D.end))return er('Slot '+f12(s.s)+' berada di luar waktu operasi.');if(i&&tm(s.s)<tm(sl2[i-1].e))return er('Slot '+f12(s.s)+' bertindih dengan slot sebelumnya.')}
if(!sl2.some(s=>s.t=='t'))return er('Sekurang-kurangnya satu slot pengajaran diperlukan.');D.slots=sl2;S.cfg=D;D=null;mut('Tetapan waktu dikemas kini');toast('Tetapan disimpan. Semak konflik jika slot lama berubah.')}
const NAV=[['dash','📊','Dashboard'],['teachers','👩‍🏫','Pengurusan Guru'],['classes','🏫','Pengurusan Kelas'],['subjects','📚','Mata Pelajaran'],['rooms','🚪','Bilik Khas'],['tt','🗓️','Jadual Waktu'],['gen','⚙️','Penjana Automatik'],['conf','✅','Semakan Konflik'],['rep','🖨️','Laporan'],['set','🔧','Tetapan']];
const PG={dash,teachers:()=>crud('teachers'),classes:()=>crud('classes'),subjects:()=>crud('subjects')+'<div style="height:16px"></div>'+crud('req'),rooms:()=>crud('rooms'),tt:ttPage,gen,conf,rep,set:setp};
const go=p=>{if(page=='set'&&p!='set')D=null;page=p;render();scrollTo(0,0)};
function render(){$('#nav').innerHTML='<h1>SRIIBB</h1><small>Sistem Pengurusan Jadual Waktu Sekolah</small>'+NAV.map(n=>'<a href=# class="'+(n[0]==page?'on':'')+'" onclick="go(\''+n[0]+'\');return false">'+n[1]+' '+n[2]+'</a>').join('');$('#app').innerHTML='<div class=pg>'+PG[page]()+'</div>'}
render();
</script></body></html>
